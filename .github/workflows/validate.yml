name: Validate

# Runs on every push and pull request to keep the codebase healthy:
# Syntax, lint, formatting, unit, browser, responsive and offline checks.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Quality and browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dev dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Syntax check (node --check)
        run: |
          for file in js/*.js sw.js scripts/*.mjs tests/*.mjs; do
            node --check "$file"
          done


      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Unit and browser tests
        run: npm run validate
